# FAST-LIO 配置 — Mid-360 仿真 (Ignition Fortress 32线 gpu_lidar)
# 适用于 outdoor_sim 仿真环境

common:
    lid_topic: "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false         # 仿真时钟完美对齐，无需时间同步
    extrinsic_est_en: false     # 仿真中外参已知，关闭在线估计
    path_en: true               # 保存轨迹

preprocess:
    lidar_type: 2               # 2 = Velodyne/PointCloud2 输入
    scan_line: 32               # 32线雷达
    blind: 4                    # 盲区 4m（比默认稍大，过滤掉机器人自身点）
    point_filter_num: 3         # 每3个点采1个（降采样，节省RK3588算力）

mapping:
    filter_size_surf: 0.15      # 面特征滤波尺寸
    filter_size_map: 0.15       # 地图体素滤波尺寸
    cube_side_length: 1000      # 地图立方体边长 (足够覆盖50m×50m草坪)
    runtime_dump_en: false
    maximum_inc_meas: 2000      # 每次最大增量点数
    publish_effect_world: false
    publish_effect_world_resolution: 0.05

    # 外参 LiDAR→IMU
    extrinsic_T: [0, 0, 0.03]   # LiDAR 在 IMU 上方 3cm (仿真urdf 中设定)
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]      # 单位阵 (仿真中已对齐)

    # IMU 噪声参数 (仿真 IMU 噪声模型)
    imu_gyro_noise: 0.0001      # 角速度噪声密度 (rad/s/√Hz)
    imu_acc_noise: 0.01         # 加速度噪声密度 (m/s²/√Hz)
    imu_gyro_bias_noise: 0.000001
    imu_acc_bias_noise: 0.0001

    # 滤波参数
    maximum_iteration: 3        # IK.D 迭代次数（仿真中收敛快）
    minimum_uncertainty: 0.001
    imu_time_shift: 0.0         # 仿真中无时间偏移
    cut_frame_num: 10000
    com_cov: 0.1

    # 图优化
    if_dump_seq: false
    if_record_offline_map: false
    online_map_resolution: 0
    filter_offboard: false
