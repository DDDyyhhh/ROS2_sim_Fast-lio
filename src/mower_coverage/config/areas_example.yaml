# areas_example.yaml — 斜坡场景预设区域（多区域 + 内岛示例）
#
# 坐标系：map (原点在 30×30m 地形中心)
# 地形特征：西北高(+2.5m)、东南低(-1.5m)
#
# 区域说明：
#   front_lawn — 西南区域，含花坛内岛
#   back_lawn — 东北区域，含陡坡禁入内岛
#
# 使用方式：
#   ros2 launch mower_coverage hill_coverage.launch.py
#   ros2 service call /multi_area/load std_srvs/srv/Trigger "{}"

areas:
  - name: "front_lawn"
    # 西南区域（缓坡为主）
    points: [[-12, -12], [-12, 2], [8, 2], [8, -12]]
    # 内岛：花坛
    inner_rings:
      - [[-3, -3], [-3, -1], [-1, -1], [-1, -3]]
    color: [0.0, 0.8, 0.0]       # 绿色
    cutting_angle: 0.0            # 牛耕式角度 (弧度)
    max_speed: 1.0                # 最大速度 (m/s)

  - name: "back_lawn"
    # 东北区域（含丘陵 + 脊线）
    points: [[-2, 2], [-2, 12], [12, 12], [12, 2]]
    # 内岛：西北丘顶陡坡禁入区
    inner_rings:
      - [[1, 6], [1, 9], [4, 9], [4, 6]]
    color: [0.0, 0.5, 1.0]       # 蓝色
    cutting_angle: 0.3            # 略倾斜
    max_speed: 0.8                # 坡上慢一点
