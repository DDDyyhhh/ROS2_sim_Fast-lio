# ekf_params.yaml — ekf_node 专用参数
# robot_localization EKF 标准参数格式
frequency: 30.0
sensor_timeout: 0.1
two_d_mode: false
publish_acceleration: false
world_frame: odom
base_link_frame: body

odom0: /Odometry
odom0_config: [true, true, true, true, true, true,
               false, false, false, false, false, false,
               false, false, false, false, false, false]
odom0_differential: true
odom0_relative: false
odom0_queue_size: 10

imu0: /imu/data
imu0_config: [false, false, false, true, true, true,
              false, false, false, true, true, true,
              false, false, false, false, false, false]
imu0_differential: false
imu0_relative: true
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

odom1: /odom/gps
odom1_config: [true, true, false, false, false, true,
               false, false, false, false, false, false,
               false, false, false, false, false, false]
odom1_differential: false
odom1_relative: false
odom1_queue_size: 10
